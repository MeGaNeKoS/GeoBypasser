<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoBypass-er Settings</title>
  <link rel="stylesheet" href="ui/styles/tokens.css">
  <link rel="stylesheet" href="ui/styles/base.css">
  <link rel="stylesheet" href="ui/styles/components.css">
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="ui/styles/shell.css">
  <link rel="icon" type="image/svg+xml" href="icons/icon_light_gray_bg.svg">
  <link rel="alternate icon" type="image/png" href="icons/icon32.png">
</head>
<body>
  <div id="navBar">
    <a class="shell-brand" href="#home">GeoBypass</a>
    <button id="navToggle" class="nav-toggle" aria-controls="tabs" aria-expanded="false"></button>
    <nav id="tabs">
      <button data-tab="home"><span class="nav-label">Home</span></button>
      <span class="nav-group">Set up</span>
      <button data-tab="proxy"><span class="nav-label">Proxies</span></button>
      <button data-tab="rules"><span class="nav-label">Rules</span></button>
      <button data-tab="override"><span class="nav-label">Sites</span></button>
      <button data-tab="keepalive"><span class="nav-label">Keep-alive</span></button>
      <button data-tab="general"><span class="nav-label">Defaults</span></button>
      <span class="nav-group">Tools</span>
      <button data-tab="diagnostics"><span class="nav-label">Test</span></button>
      <button data-tab="network"><span class="nav-label">Network</span></button>
      <button data-tab="impexp"><span class="nav-label">Import and export</span></button>
      <button data-tab="about"><span class="nav-label">About</span></button>
    </nav>
  </div>
  <div id="content" tabindex="-1">
    <div id="controlBanner" class="control-banner"></div>
    <section id="home" class="tab">
      <div id="homeContent"></div>
    </section>
    <section id="general" class="tab">
      <div id="defaultsContent"></div>
    </section>
    <section id="proxy" class="tab">
      <div id="proxyContent"></div>
    </section>
    <section id="rules" class="tab">
      <div id="rulesContent"></div>
    </section>
    <section id="override" class="tab">
      <div id="overrideContent"></div>
    </section>
    <section id="keepalive" class="tab">
      <div id="keepAliveContent"></div>
    </section>
    <section id="network" class="tab">
      <div id="networkContent"></div>
    </section>
    <section id="diagnostics" class="tab">
      <div id="testContent"></div>
    </section>
    <section id="impexp" class="tab">
      <h2>Import/Export</h2>
      <p class="section-help">Backup or restore configuration and import community rules.</p>
      <button id="openExportConfig">Export Config</button>
      <div id="exportConfigModal" class="modal hidden">
        <div class="modal-content">
          <h3>Select Items to Export</h3>
          <p class="modal-help">Choose which settings to save to a JSON file.</p>
          <div id="exportConfigItems"></div>
          <div id="exportConfigControls">
            <button id="exportConfigSelectAll">Select Entire Config</button>
          </div>
          <label><input type="checkbox" id="exportConfigLeaveOutCredentials"> Leave out usernames and passwords</label>
          <button id="exportConfigConfirm">Export</button>
          <button id="exportConfigCancel">Cancel</button>
        </div>
      </div>
    </section>
    <section id="about" class="tab">
      <div id="aboutContent"></div>
    </section>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
